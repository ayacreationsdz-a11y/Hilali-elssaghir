:root{--pu:#A78BFA;--puD:#7052B8;--go:#FFD166;--mi:#A8E6CF;--sk:#A7D8F0;--pk:#F7C8D8;--bg:#FFF9EF;--ink:#39334A;--mut:#857D96;--line:#EEE6F7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:500 17px/1.6 Tajawal,sans-serif;min-height:100vh}
[dir=ltr] body,[dir=ltr] button,[dir=ltr] input{font-family:Poppins,sans-serif;font-size:15.5px}
button,input{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none;padding:0}
#app{max-width:560px;margin:0 auto;padding-bottom:96px}
main{padding:6px 16px 20px}
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;background:rgba(255,249,239,.94);backdrop-filter:blur(8px)}
.tl{display:flex;align-items:center;gap:8px}.tl b{font-size:19px;font-weight:800;color:var(--puD)}
.pt{flex:1;font-size:18px;font-weight:800;color:var(--puD);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;border-radius:16px;background:#fff;font-size:22px;font-weight:800;box-shadow:0 2px 8px rgba(112,82,184,.1)}
.spill{background:var(--go);padding:7px 14px;border-radius:20px;font-weight:800;font-family:Poppins,sans-serif;box-shadow:0 3px 0 #E9B43F}
.bn{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:520px;display:flex;background:#fff;border-radius:26px;padding:6px;box-shadow:0 8px 26px rgba(112,82,184,.18);z-index:20}
.bn button{flex:1;display:flex;flex-direction:column;align-items:center;font-size:13px;font-weight:700;color:var(--mut);padding:4px;border-radius:20px}
.bn button span{font-size:22px;line-height:1.3}.bn button.on{background:#F1EBFF;color:var(--puD)}
.card{display:block;width:100%;background:#fff;border-radius:24px;padding:16px;margin-bottom:12px;box-shadow:0 3px 14px rgba(112,82,184,.08);text-align:start}
.c{text-align:center}.muted{color:var(--mut)}.mt{margin-top:10px}.full{width:100%;display:block}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.g2>*,.g3>*{min-width:0}
.btn{min-height:50px;padding:10px 14px;border-radius:18px;background:var(--puD);color:#fff;font-weight:800;box-shadow:0 4px 0 #563D96;line-height:1.35}
.btn.soft{background:#F1EBFF;color:var(--puD);box-shadow:0 4px 0 #DCD0F7}
.btn:active,.big:active{transform:translateY(3px);box-shadow:none}.btn[disabled]{opacity:.45}
.btn.danger{color:#C2416B}
.big{display:block;width:100%;min-height:58px;margin-top:12px;border-radius:22px;background:var(--puD);color:#fff;font-weight:800;font-size:19px;box-shadow:0 5px 0 #563D96}
.lnk{color:var(--puD);font-weight:800;padding:10px;margin-top:4px}
input[type=text]{width:100%;min-height:54px;border:2.5px solid var(--line);border-radius:18px;padding:10px 16px;font-size:19px;background:#fff;outline:0}
input:focus{border-color:var(--pu)}
.note{background:#F1EBFF;border-radius:20px;padding:12px 14px;margin-bottom:12px;font-size:15.5px;line-height:1.6}
.okt{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-height:46px;padding:6px 14px;border-radius:16px;background:#E5F8EF;color:#2E8B5E;font-weight:800}
.tag{background:#FFF3D1;border-radius:14px;padding:3px 10px;font-size:14px;font-weight:700}
/* hilal */
.hil{flex:none;overflow:visible}.bob{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(3deg)}}
/* onboarding */
.onb{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px 22px;gap:8px;max-width:480px;margin:0 auto}
.onb h1{font-size:28px;line-height:1.45;margin:8px 0 0;color:var(--puD)}.onb h2{font-size:25px;margin:8px 0 0;color:var(--puD)}.onb p{margin:0 0 8px;color:var(--mut)}
.sky{width:220px;height:220px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#E9E0FF,#C9B6FA 70%);display:flex;align-items:center;justify-content:center;position:relative}
.sky:after{content:"✨ ⭐ ✨";position:absolute;top:-6px;font-size:18px;letter-spacing:40px}
.langs{display:flex;gap:10px;margin:8px 0}.chip{padding:8px 18px;border-radius:18px;background:#fff;border:2.5px solid var(--line);font-weight:700}.chip.on{border-color:var(--pu);background:#F1EBFF}
.ages{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;margin:10px 0}
.age{background:#fff;border:3px solid var(--line);border-radius:22px;padding:14px 4px;display:flex;flex-direction:column;align-items:center}
.age span{font-size:36px}.age b{font-size:20px;font-family:Poppins,sans-serif}.age.on{border-color:var(--pu);background:#F1EBFF}
.brand{color:var(--mut);font-size:13px;margin-top:10px}
/* home */
.hero{display:flex;align-items:center;gap:6px;margin:4px 0 12px}
.bub{flex:1;background:#fff;border-radius:24px;padding:14px 16px;box-shadow:0 3px 14px rgba(112,82,184,.1);position:relative}
.bub b{display:block;font-size:19px;font-weight:800;color:var(--puD);line-height:1.45}.bub span{font-size:15.5px;color:var(--mut)}
.prog .dots{display:flex;justify-content:space-between;margin:10px 0}.prog .dots i{font-style:normal;width:40px;height:40px;border-radius:50%;background:#F3EFFA;display:flex;align-items:center;justify-content:center;font-size:19px;filter:grayscale(1);opacity:.55}
.prog .dots i.on{background:var(--go);filter:none;opacity:1}
.bar{height:12px;border-radius:8px;background:#F1EBFF;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--go),#F4B740)}
.secs,.gg{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.sec{background:var(--c);border-radius:26px;padding:18px 10px;min-height:136px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;box-shadow:0 5px 0 rgba(57,51,74,.12)}
.sec span{font-size:44px;line-height:1.2}.sec b{font-size:17px;font-weight:800;line-height:1.35}
.shelf div{display:flex;justify-content:space-around;margin:10px 0 4px}.shelf span{display:flex;flex-direction:column;align-items:center;font-size:30px;opacity:.45}.shelf span.on{opacity:1}.shelf small{font-size:11.5px;color:var(--mut)}
/* tabs */
.tabs{display:flex;gap:6px;background:#F1EBFF;border-radius:20px;padding:5px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:1 0 auto;padding:9px 12px;border-radius:16px;font-weight:700;font-size:15px;color:var(--puD);white-space:nowrap}.tabs button.on{background:#fff;box-shadow:0 2px 6px rgba(112,82,184,.15)}
/* learn */
.lc{text-align:center}.lci{font-size:48px}.lc h3{margin:4px 0;font-size:20px;color:var(--puD)}.lc p{margin:4px 0 12px;font-size:17px;line-height:1.75}
.opt{display:flex;align-items:center;gap:10px;width:100%;padding:12px;margin-top:10px;border-radius:18px;background:#FBF8FF;border:2.5px solid var(--line);text-align:start}
.opt span{font-size:28px}.opt b{flex:1;font-size:16px;line-height:1.45}.opt em{font-style:normal;font-size:22px}.opt.on{border-color:var(--mi);background:#EEFBF4}
/* quiz */
.q{font-size:21px;line-height:1.5;margin:10px 0}.ans{display:block;width:100%;min-height:56px;margin-top:10px;border-radius:18px;background:#FBF8FF;border:2.5px solid var(--line);font-weight:700;font-size:17px;padding:8px 12px}
.ans.good{background:#E5F8EF;border-color:#4FB286}.ans.bad{background:#FFF0F3;border-color:#F3A9BC}
.fb{margin-top:12px;padding:12px;border-radius:16px;background:#FFF6DB;line-height:1.6}.fb.ok{background:#E5F8EF}
.score{font:800 40px Poppins,sans-serif;color:var(--puD);margin:4px 0}
/* quran */
.slist .srow{display:flex;align-items:center;gap:10px;padding:14px 16px}.srow span{color:var(--mut);font-size:14px;flex:1}.srow em{font-style:normal;font-size:22px}
.sn{font-family:Amiri,Tajawal,serif;font-size:24px;color:var(--puD);font-weight:700}.srow .sn{flex:none;min-width:84px;color:var(--ink);font-size:23px}
.qt{font-family:Amiri,serif;font-size:27px;line-height:2.25;text-align:center;margin:8px 0;color:#2C2640;font-weight:400}.qt.sm{font-size:23px}
.vn{color:#9A7B2F;font-size:22px;white-space:nowrap}.basm{font-family:Amiri,serif;font-size:25px;text-align:center;margin:4px 0;color:var(--puD)}
.mush{background:#FFFDF6;border:3px solid #F4E3B2}
.ayah{text-align:center}.ayah h4{margin:12px 0 2px;color:var(--puD)}.ayah p{margin:2px 0}.ref{color:#9A7B2F;font-weight:700}
/* deeds */
.deed{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center}.deed .de{font-size:38px;grid-row:span 2}.deed b{font-size:17px;line-height:1.45}.deed .btn,.deed .okt,.deed .lnk{grid-column:2;justify-self:start}.deed.on{background:#FFFBEA}
.dua{background:#FBF8FF;box-shadow:none}
/* memory */
.mem{display:grid;gap:8px;grid-template-columns:repeat(4,1fr);margin-bottom:12px}.mem.m4{grid-template-columns:repeat(4,1fr)}
.mc{aspect-ratio:3/4;border-radius:16px;background:linear-gradient(145deg,var(--pu),var(--puD));color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:30px;box-shadow:0 4px 0 #563D96;transition:transform .2s}
.mc small{font-size:11px;font-weight:700;line-height:1.2}.mc.up{background:#fff;color:var(--ink);box-shadow:0 3px 0 #E6DDF8;transform:rotateY(0)}.mc.ok{background:#E5F8EF}
/* order */
.slots,.pool{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.slot,.pc{min-height:104px;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;text-align:center;position:relative}
.slot{border:3px dashed #D8CFEA;background:#FBF8FF}.slot em{position:absolute;top:6px;inset-inline-start:10px;font:800 15px Poppins,sans-serif;color:var(--pu);font-style:normal}
.slot span,.pc span{font-size:34px}.slot small,.pc small{font-size:13.5px;font-weight:700;line-height:1.35}
.pc{background:#fff;box-shadow:0 4px 0 #E6DDF8}.slot.good{border:3px solid #4FB286;background:#E5F8EF}.slot.bad{border:3px solid #F3A9BC;background:#FFF0F3}
/* coloring */
.dthumb{display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}.dthumb em{position:absolute;top:8px;inset-inline-end:10px;font-style:normal}
svg.th{width:100%;max-width:130px}svg.cv{width:100%;max-width:400px;touch-action:manipulation}svg.cv>*{cursor:pointer}
.pal{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:4px 0 8px}.pal button{aspect-ratio:1;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #E6DDF8}.pal button.on{box-shadow:0 0 0 4px var(--puD);transform:scale(1.08)}
/* map & cert */
.map svg{width:100%}
.cert{background:linear-gradient(135deg,var(--pu),var(--sk));border-radius:28px;padding:10px;margin-bottom:6px}
.cin{background:var(--bg);border-radius:22px;padding:20px 16px;text-align:center;border:3px solid var(--go)}
.cin h2{color:var(--puD);margin:6px 0;font-size:24px}.cn{font-size:30px;font-weight:800;margin:6px 0}.ct{font-size:18px;font-weight:700;line-height:1.6}.cs{color:var(--mut)}.cd{font-size:26px;letter-spacing:6px}
/* sheet, toast, celebration */
#sh{position:fixed;inset:0;z-index:50}.shbg{position:absolute;inset:0;background:rgba(57,51,74,.4)}
.sheet{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;max-height:90vh;overflow:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:20px 18px 28px}
.sheet h3{margin:0 0 8px;color:var(--puD)}
#toast{position:fixed;bottom:96px;left:50%;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:18px;opacity:0;transition:.2s;z-index:60;pointer-events:none;max-width:calc(100% - 32px);text-align:center;font-weight:700}
#toast.on{opacity:1;transform:translate(-50%,0)}
.cele{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;background:rgba(57,51,74,.35);animation:fin .25s}
.cele.out{opacity:0;transition:opacity .35s}
.cbox{background:#fff;border-radius:30px;padding:20px 26px;text-align:center;box-shadow:0 12px 40px rgba(57,51,74,.25);animation:pop .4s cubic-bezier(.3,1.6,.6,1);max-width:300px}
.cbox b{display:block;font:800 34px Poppins,sans-serif;color:#E9A800}.cbox p{margin:4px 0;font-weight:700;font-size:18px}.cbox .dec{color:var(--puD);font-size:15px}
.cele i{position:absolute;left:50%;top:50%;font-style:normal;font-size:26px;animation:burst 1.1s ease-out forwards}
@keyframes burst{0%{transform:translate(-50%,-50%) scale(.3);opacity:1}100%{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1.1);opacity:0}}
@keyframes pop{0%{transform:scale(.5)}100%{transform:scale(1)}}@keyframes fin{from{opacity:0}}
@media (min-width:480px){.mem{grid-template-columns:repeat(4,1fr)}}
.duab{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#F1EBFF,#FFF3D1)}.duab span{font-size:34px}.duab b{flex:1;font-size:18px;color:var(--puD)}.duab em{font-style:normal;font-weight:800;color:var(--mut)}
.dua{text-align:center}.dua .row{justify-content:center}.dua .btn,.dua .okt{margin-top:8px}.dua.on{background:#FFFBEA}.small{font-size:14.5px;color:var(--mut)}
.dua .ref{display:block}
.sh{font-size:17px;margin:6px 4px 8px;color:var(--puD)}.sh.muted{color:var(--mut)}
.tabs{flex-wrap:wrap;overflow:visible}.tabs button{flex:1 1 auto;white-space:normal;line-height:1.3}

.ayab{display:flex;flex-direction:column;align-items:center;gap:6px;margin:14px auto 4px}.ayab img{width:64px;height:64px;border-radius:16px;box-shadow:0 4px 12px rgba(88,10,102,.25)}.ayab small{color:var(--mut);font-size:13px}
#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#FFF9EF;color:#7052B8;font:800 24px Tajawal,sans-serif}

var SURAHS=[
{id:"fatiha",ar:"الفاتحة",fr:"Al-Fâtiha",basm:false,v:["بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ","الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ","الرَّحْمَٰنِ الرَّحِيمِ","مَلِكِ يَوْمِ الدِّينِ","إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ","اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ","صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ"]},
{id:"ikhlas",ar:"الإخلاص",fr:"Al-Ikhlâs",v:["قُلْ هُوَ اللَّهُ أَحَدٌ","اللَّهُ الصَّمَدُ","لَمْ يَلِدْ وَلَمْ يُولَدْ","وَلَمْ يَكُن لَّهُ كُفُؤًا أَحَدٌ"]},
{id:"falaq",ar:"الفلق",fr:"Al-Falaq",v:["قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ","مِن شَرِّ مَا خَلَقَ","وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ","وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ","وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ"]},
{id:"nas",ar:"الناس",fr:"An-Nâs",v:["قُلْ أَعُوذُ بِرَبِّ النَّاسِ","مَلِكِ النَّاسِ","إِلَٰهِ النَّاسِ","مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ","الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ","مِنَ الْجِنَّةِ وَالنَّاسِ"]},
{id:"kawthar",ar:"الكوثر",fr:"Al-Kawthar",v:["إِنَّا أَعْطَيْنَاكَ الْكَوْثَرَ","فَصَلِّ لِرَبِّكَ وَانْحَرْ","إِنَّ شَانِئَكَ هُوَ الْأَبْتَرُ"]},
{id:"asr",ar:"العصر",fr:"Al-'Asr",v:["وَالْعَصْرِ","إِنَّ الِانسَانَ لَفِي خُسْرٍ","إِلَّا الَّذِينَ ءَامَنُوا وَعَمِلُوا الصَّالِحَاتِ وَتَوَاصَوْا بِالْحَقِّ وَتَوَاصَوْا بِالصَّبْرِ"]},
{id:"nasr",ar:"النصر",fr:"An-Nasr",v:["إِذَا جَاءَ نَصْرُ اللَّهِ وَالْفَتْحُ","وَرَأَيْتَ النَّاسَ يَدْخُلُونَ فِي دِينِ اللَّهِ أَفْوَاجًا","فَسَبِّحْ بِحَمْدِ رَبِّكَ وَاسْتَغْفِرْهُ إِنَّهُ كَانَ تَوَّابًا"]},
{id:"masad",ar:"المسد",fr:"Al-Masad",v:["تَبَّتْ يَدَا أَبِي لَهَبٍ وَتَبَّ","مَا أَغْنَىٰ عَنْهُ مَالُهُ وَمَا كَسَبَ","سَيَصْلَىٰ نَارًا ذَاتَ لَهَبٍ","وَامْرَأَتُهُ حَمَّالَةُ الْحَطَبِ","فِي جِيدِهَا حَبْلٌ مِّن مَّسَدٍ"]},
{id:"quraysh",ar:"قريش",fr:"Quraych",v:["لِإِيلَافِ قُرَيْشٍ","إِيلَافِهِمْ رِحْلَةَ الشِّتَاءِ وَالصَّيْفِ","فَلْيَعْبُدُوا رَبَّ هَٰذَا الْبَيْتِ","الَّذِي أَطْعَمَهُم مِّن جُوعٍ وَءَامَنَهُم مِّنْ خَوْفٍ"]},
{id:"maun",ar:"الماعون",fr:"Al-Mâ'ûn",v:["أَرَآيْتَ الَّذِي يُكَذِّبُ بِالدِّينِ","فَذَٰلِكَ الَّذِي يَدُعُّ الْيَتِيمَ","وَلَا يَحُضُّ عَلَىٰ طَعَامِ الْمِسْكِينِ","فَوَيْلٌ لِّلْمُصَلِّينَ","الَّذِينَ هُمْ عَن صَلَاتِهِمْ سَاهُونَ","الَّذِينَ هُمْ يُرَاءُونَ","وَيَمْنَعُونَ الْمَاعُونَ"]},
{id:"kafirun",ar:"الكافرون",fr:"Al-Kâfiroûn",v:["قُلْ يَا أَيُّهَا الْكَافِرُونَ","لَا أَعْبُدُ مَا تَعْبُدُونَ","وَلَا أَنتُمْ عَابِدُونَ مَا أَعْبُدُ","وَلَا أَنَا عَابِدٌ مَّا عَبَدتُّمْ","وَلَا أَنتُمْ عَابِدُونَ مَا أَعْبُدُ","لَكُمْ دِينُكُمْ وَلِيَ دِينِ"]},
{id:"fil",ar:"الفيل",fr:"Al-Fîl",v:["أَلَمْ تَرَ كَيْفَ فَعَلَ رَبُّكَ بِأَصْحَابِ الْفِيلِ","أَلَمْ يَجْعَلْ كَيْدَهُمْ فِي تَضْلِيلٍ","وَأَرْسَلَ عَلَيْهِمْ طَيْرًا أَبَابِيلَ","تَرْمِيهِم بِحِجَارَةٍ مِّن سِجِّيلٍ","فَجَعَلَهُمْ كَعَصْفٍ مَّاكُولٍ"]},
{id:"qadr",ar:"القدر",fr:"Al-Qadr",v:["إِنَّا أَنزَلْنَاهُ فِي لَيْلَةِ الْقَدْرِ","وَمَا أَدْرَاكَ مَا لَيْلَةُ الْقَدْرِ","لَيْلَةُ الْقَدْرِ خَيْرٌ مِّنْ أَلْفِ شَهْرٍ","تَنَزَّلُ الْمَلَائِكَةُ وَالرُّوحُ فِيهَا بِإِذْنِ رَبِّهِم مِّن كُلِّ أَمْرٍ","سَلَامٌ هِيَ حَتَّىٰ مَطْلَعِ الْفَجْرِ"]},

["🌙","ما معنى الصيام؟","Que veut dire jeûner ?",["الصيام هو ألّا نأكل ولا نشرب من الفجر إلى المغرب، طاعةً لله.","الصيام هو أن نمتنع عن الأكل والشرب من الفجر إلى أذان المغرب، طاعةً لله. وعند المغرب نفطر مع العائلة.","الصيام هو الامتناع عن الأكل والشرب من طلوع الفجر إلى غروب الشمس، طاعةً لله. وهو ركن من أركان الإسلام الخمسة."],["Jeûner, c'est ne pas manger ni boire de l'aube au coucher du soleil, pour obéir à Allah.","Jeûner, c'est ne pas manger ni boire de l'aube jusqu'à l'appel du Maghrib, pour obéir à Allah. Au Maghrib, on rompt le jeûne en famille.","Le jeûne consiste à s'abstenir de manger et de boire de l'aube au coucher du soleil, pour obéir à Allah. C'est l'un des cinq piliers de l'islam."]],
["🤍","لماذا نصوم؟","Pourquoi jeûne-t-on ?",["نصوم لأن الله أمرنا بذلك، والصيام يعلّمنا الصبر.","نصوم في رمضان لأن الله أمرنا بالصيام، والصيام يعلّمنا الصبر والشكر على نعمة الطعام والماء.","قال الله تعالى عن الصيام: «لَعَلَّكُمْ تَتَّقُونَ» (البقرة: 183). فالصيام يجعلنا نراقب أنفسنا، ونصبر، ونشكر الله على نعمه."],["On jeûne parce qu'Allah nous l'a demandé, et le jeûne nous apprend la patience.","On jeûne pendant le Ramadan parce qu'Allah l'a prescrit. Le jeûne nous apprend la patience et la gratitude pour la nourriture et l'eau.","Allah dit à propos du jeûne : « afin que vous soyez pieux » (Al-Baqara, 183). Le jeûne nous apprend à nous surveiller, à être patients et reconnaissants."]],
["⭐","ماذا نتعلم من رمضان؟","Qu'apprend-on du Ramadan ?",["نتعلم الصبر، والكلمة الطيبة، ومساعدة الآخرين.","في رمضان نتعلم الصبر، ونقول كلاماً طيباً، ونقرأ القرآن، ونساعد عائلتنا وجيراننا.","رمضان مدرسة: نتعلم فيه الصبر والتحكم في النفس، والكلمة الطيبة، وقراءة القرآن، والكرم مع المحتاجين، وصلة الأقارب."],["On apprend la patience, les belles paroles et l'entraide.","Pendant le Ramadan, on apprend la patience, on dit de belles paroles, on lit le Coran et on aide sa famille et ses voisins.","Le Ramadan est une école : patience, maîtrise de soi, belles paroles, lecture du Coran, générosité envers les nécessiteux et liens familiaux."]],
["🤝","كيف نشعر بالآخرين؟","Comment penser aux autres ?",["عندما نجوع قليلاً، نتذكر من لا يجد طعاماً، فنساعده.","عندما نشعر بالجوع قليلاً، نتذكر الناس الذين لا يجدون طعاماً كافياً، فنحب أن نساعدهم ونشاركهم.","الجوع القليل يذكّرنا بالمحتاجين، فنتصدق ونشارك طعامنا، ولهذا نعطي زكاة الفطر قبل صلاة العيد حتى يفرح الجميع بالعيد."],["Quand on a un peu faim, on pense à ceux qui n'ont pas à manger, et on les aide.","Quand on a un peu faim, on pense à ceux qui n'ont pas assez à manger, et on a envie de les aider et de partager.","La faim nous rappelle les nécessiteux : on partage et on donne. C'est pourquoi on donne la zakat al-fitr avant la prière de l'Aïd, pour que tout le monde soit heureux."]],
["🧒","الأطفال والصيام","Les enfants et le jeûne",["الصيام ليس واجباً على الأطفال. يمكنك أن تجرّب قليلاً مع عائلتك، وإذا تعبت فكُل واشرب.","الصيام ليس واجباً على الأطفال الصغار. يمكنك أن تتدرب حسب قدرتك وبإذن عائلتك. إذا شعرت بالتعب أو العطش، فكُل واشرب، ولا بأس في ذلك.","الصيام يجب على المسلم عندما يكبر ويبلغ. قبل ذلك، يمكنك أن تتدرب حسب قدرتك وبإذن والديك. صحتك مهمة: إذا تعبت أو عطشت كثيراً، فأفطر وأخبر عائلتك."],["Le jeûne n'est pas obligatoire pour les enfants. Tu peux essayer un peu avec ta famille, et si tu es fatigué, mange et bois.","Le jeûne n'est pas obligatoire pour les petits. Tu peux t'entraîner selon tes forces, avec l'accord de ta famille. Si tu es fatigué ou as soif, mange et bois : ce n'est pas grave.","Le jeûne devient obligatoire quand on grandit (à la puberté). Avant, tu peux t'entraîner selon tes forces, avec l'accord de tes parents. Ta santé compte : si tu es très fatigué ou assoiffé, romps le jeûne et préviens ta famille."]]];

["🤲","كيف نحافظ على المصحف؟","Comment prendre soin du Mushaf ?",["نمسكه بيد نظيفة، ونضعه في مكان نظيف.","نمسك المصحف بيد نظيفة، ونضعه في مكان نظيف ومرتفع، ولا نرميه ولا نكتب عليه.","نحترم المصحف: نمسكه بيدين نظيفتين، ونضعه في مكان نظيف ومرتفع، ولا نرميه، ولا نكتب أو نرسم عليه، ونعيده إلى مكانه بعد القراءة."],["On le tient avec des mains propres et on le pose dans un endroit propre.","On tient le Mushaf avec des mains propres, on le pose dans un endroit propre et en hauteur, on ne le jette pas et on n'écrit pas dessus.","On respecte le Mushaf : mains propres, endroit propre et en hauteur, on ne le jette pas, on n'écrit ni ne dessine dessus, et on le range après la lecture."]],
["💚","لماذا نقرأ القرآن؟","Pourquoi lire le Coran ?",["نقرأ القرآن لنتعلم ما يحبه الله، فيفرح قلبنا.","نقرأ القرآن لنتعلم ما يحبه الله، ولأن قراءته تُريح القلب.","نقرأ القرآن لنفهم ما يحبه الله ونعمل به. قال الله تعالى: «أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ» (الرعد: 28)."],["On lit le Coran pour apprendre ce qu'Allah aime, et notre cœur est content.","On lit le Coran pour apprendre ce qu'Allah aime, et parce que sa lecture apaise le cœur.","On lit le Coran pour comprendre ce qu'Allah aime et l'appliquer. Allah dit : « C'est par l'évocation d'Allah que les cœurs se tranquillisent » (Ar-Ra'd, 28)."]],
["👂","كيف نستمع للقرآن؟","Comment écouter le Coran ?",["عندما نسمع القرآن، نسكت ونستمع بهدوء.","عندما يُقرأ القرآن، نسكت ونستمع بهدوء واحترام.","قال الله تعالى: «وَإِذَا قُرِئَ الْقُرْآنُ فَاسْتَمِعُوا لَهُ وَأَنصِتُوا» (الأعراف: 204). فعندما نسمع القرآن نتوقف عن الكلام والضجيج، ونستمع بقلوبنا."],["Quand on entend le Coran, on se tait et on écoute calmement.","Quand le Coran est récité, on se tait et on écoute calmement, avec respect.","Allah dit : « Et quand on lit le Coran, écoutez-le attentivement et observez le silence » (Al-A'râf, 204). On arrête de parler et on écoute avec le cœur."]]];
